[project]
name = "hunterbot"
version = "0.1.0"
description = "Modular, AI-assisted platform for authorized bug bounty and defensive security assessments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "beautifulsoup4>=4.12",
    "markdown>=3.6",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
hunterbot = "hunterbot.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hunterbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
