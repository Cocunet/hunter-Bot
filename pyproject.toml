[project]
name = "hunterbot"
version = "0.1.0"
description = "Modular, AI-assisted platform for authorized bug bounty and defensive security assessments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "beautifulsoup4>=4.12",
    "markdown>=3.6",
    "pypdf>=4.0",
    "httpx>=0.27",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
semantic = [
    "scikit-learn>=1.4",
]
llm = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "hunterbot[semantic]",
    "hunterbot[llm]",
]

[project.scripts]
hunterbot = "hunterbot.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hunterbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Correctness-focused: real bugs (pyflakes, pycodestyle errors), not style
# preferences (import sorting, pyupgrade, etc.) which would churn the whole
# tree without fixing anything a test wouldn't already catch.
select = ["E4", "E7", "E9", "F"]
